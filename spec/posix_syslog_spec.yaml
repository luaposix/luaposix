before:
  this_module = 'posix.syslog'
  global_table = '_G'

  M = require(this_module)


specify posix.syslog:
- context when required:
  - it does not touch the global table:
      expect(show_apis {added_to=global_table, by=this_module}).
         to_equal {}


- describe LOG_MASK:
  - context with bad arguments:
      if M.LOG_MASK then
         badargs.diagnose("(int)", M.LOG_MASK)
      end


- describe closelog:
  - context with bad arguments:
      if M.closelog then
         badargs.diagnose("()", M.closelog)
      end


- describe openlog:
  - context with bad arguments: |
      if M.openlog then
         badargs.diagnose("(string, ?int, ?int)", M.openlog)
      end


- describe setlogmask:
  - context with bad arguments:
      if M.setlogmask then
         badargs.diagnose("(?int)", M.setlogmask)
      end


- describe syslog:
  - context with bad arguments:
      if M.syslog then
         badargs.diagnose("(int, string)", M.syslog)
      end
