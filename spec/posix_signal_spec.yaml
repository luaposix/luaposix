before:
  this_module = 'posix.signal'
  global_table = '_G'

  M = require(this_module)


specify posix.signal:
- context when required:
  - it does not touch the global table:
      expect(show_apis {added_to=global_table, by=this_module}).
        to_equal {}


- describe kill:
  - context with bad arguments:
      badargs.diagnose("(int, ?int)", M.kill)


- describe killpg:
  - context with bad arguments:
      badargs.diagnose("(int, ?int)", M.killpg)


- describe raise:
  - context with bad arguments:
      badargs.diagnose("(int)", M.raise)


- describe signal:
  - context with bad arguments:
      badargs.diagnose("(int, ?function|string, ?int)", M.signal)
